[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchfleet"
version = "0.0.0"
description = "Local-first, human-approved coordination for coding-agent CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
patchfleet = "patchfleet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
