[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchfleet"
version = "0.0.0"
description = "Local-first, human-approved coordination for coding-agent CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.12,<1", "pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.16,<1"]

[project.scripts]
patchfleet = "patchfleet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "PYI"]
